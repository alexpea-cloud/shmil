<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Demo – grunnlaget i 3D</title>
<style>
@font-face{font-family:FS;src:url(../assets/fonts/Inter-Regular.otf);font-weight:400}
@font-face{font-family:FS;src:url(../assets/fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:FD;src:url(../assets/fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:FD;src:url(../assets/fonts/InterDisplay-Bold.otf);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#DCD8CF;font-family:FS,sans-serif;color:#1B2326;-webkit-font-smoothing:antialiased}
canvas{position:absolute;left:0;top:0}
.t{position:absolute;white-space:nowrap;opacity:0}
.k{font:600 25px/1 FS;letter-spacing:.16em;text-transform:uppercase;color:#007B61}
.h{font:700 84px/1.02 FD;letter-spacing:-.02em}
.lab{position:absolute;width:420px;margin-left:-210px;text-align:center;opacity:0}
.lab .a{font:600 22px/1 FS;letter-spacing:.16em;text-transform:uppercase;color:#007B61}
.lab .b{font:600 32px/1.2 FD;margin-top:10px}
.lab .c{font:400 24px/1.2 FS;color:#78848A;margin-top:6px}
#black{position:absolute;inset:0;background:#000;opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="t k" id="k1" style="left:0;width:1920px;text-align:center;top:92px">Sommeren 2026</div>
  <div class="t h" id="h1" style="left:0;width:1920px;text-align:center;top:132px">31 sider – hvert tall med kilde</div>
  <div class="lab" id="l0"><div class="a">Søknad</div><div class="b">§ 19-4</div><div class="c">6 sider</div></div>
  <div class="lab" id="l1"><div class="a">Vedlegg 1</div><div class="b">Nøkkeltall og kilder</div><div class="c">4 sider</div></div>
  <div class="lab" id="l2"><div class="a">Vedlegg 2</div><div class="b">Plukkanalyse</div><div class="c">21 sider</div></div>
  <div id="black"></div>
</div>
<script src="vendor/three-bundle.js"></script>
<script>
(function () {
'use strict';
const DUR = 10, FPS = 30;
const T = window.THREE, X = window.THREEX;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const io = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const o3 = x => 1 - Math.pow(1 - x, 3);
const pr = (t, a, b, e = io) => e(clamp((t - a) / (b - a)));
const env = (t, a, b, fi, fo) => Math.min(pr(t, a, a + fi, o3), 1 - pr(t, b - fo, b));
const $ = id => document.getElementById(id);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const renderer = new T.WebGLRenderer({ canvas: $('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1920, 1080, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
const scene = new T.Scene();
scene.background = new T.Color('#DCD8CF');
scene.fog = new T.Fog('#DCD8CF', 22, 48);
const cam = new T.PerspectiveCamera(30, 1920 / 1080, 0.1, 200);

scene.add(new T.HemisphereLight('#ffffff', '#bdb6a6', 1.05));
const sun = new T.DirectionalLight('#fff3e0', 3.1);
sun.position.set(-7, 14, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
scene.add(sun);
const floor = new T.Mesh(new T.PlaneGeometry(200, 200), new T.MeshStandardMaterial({ color: '#D6D1C6', roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// pages: real page images as textures on thin boxes (A4: 2.1 × 2.97 units)
const loader = new T.TextureLoader();
loader.crossOrigin = undefined;   // local files (render with --allow-file-access-from-files)
const pending = [];
function tex(src) {
  return new Promise(res => pending.push(new Promise(r2 => loader.load(src, tx => { tx.colorSpace = T.SRGBColorSpace; tx.anisotropy = 8; res(tx); r2(); }))));
}
const side = new T.MeshStandardMaterial({ color: '#f4f4f2', roughness: 0.9 });
const W = 2.1, H = 2.97, TH = 0.014;
const geo = new T.BoxGeometry(W, TH, H);
const STACKS = [
  { doc: 'sok', n: 6, x: -2.75, t0: 0.9, dt: 0.2 },
  { doc: 'v1', n: 4, x: 0, t0: 2.2, dt: 0.2 },
  { doc: 'v2', n: 21, x: 2.75, t0: 3.1, dt: 0.13 },
];
const pages = [];
STACKS.forEach((S, si) => {
  for (let i = 0; i < S.n; i++) {
    const num = S.n - i; // bottom page first; page 1 ends on top
    const file = S.doc === 'v2' ? `lo-v2-${String(num).padStart(2, '0')}` : `lo-${S.doc}-${num}`;
    const mat = new T.MeshStandardMaterial({ color: '#ffffff', roughness: 0.85 });
    tex(`../assets/pages/${file}.png`).then(tx => { mat.map = tx; mat.needsUpdate = true; });
    const m = new T.Mesh(geo, [side, side, mat, side, side, side]);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    pages.push({
      m, si, layer: i,
      ts: S.t0 + i * S.dt, dur: 1.05,
      x0: S.x + (rnd() - 0.5) * 1.6, z0: -1.2 + (rnd() - 0.5) * 1.4, y0: 7 + rnd() * 2,
      r0: (rnd() - 0.5) * 1.2, tilt: (rnd() - 0.5) * 0.9,
      xe: S.x + (rnd() - 0.5) * 0.06, ze: (rnd() - 0.5) * 0.06, re: (rnd() - 0.5) * 0.05,
    });
  }
});
function pose(p, t) {
  const u = clamp((t - p.ts) / p.dur);
  if (u <= 0) { p.m.visible = false; return; }
  p.m.visible = true;
  const ye = TH / 2 + p.layer * TH;
  const fall = 1 - Math.pow(1 - u, 2.2);                      // decelerating glide, like paper
  const settle = Math.sin(u * Math.PI * 2.2) * Math.pow(1 - u, 2) * 0.35;   // gentle wobble that dies out
  p.m.position.set(lerp(p.x0, p.xe, o3(u)), lerp(p.y0, ye, fall), lerp(p.z0, p.ze, o3(u)));
  p.m.rotation.set(p.tilt * (1 - o3(u)) + settle * 0.3, lerp(p.r0, p.re, o3(u)), settle * 0.2 * Math.sign(p.tilt));
}
// camera: slow orbit and rise
function camAt(t) {
  const a = lerp(-0.6, 0.1, pr(t, 0, 10, x => x * x * (3 - 2 * x)));
  const r = lerp(9.0, 10.6, pr(t, 0, 10));
  const y = lerp(3.0, 6.6, pr(t, 0, 10));
  cam.position.set(Math.sin(a) * r, y, Math.cos(a) * r);
  cam.lookAt(0, lerp(1.2, -0.35, pr(t, 0, 10)), 0);
}
const composer = new X.EffectComposer(renderer, new T.WebGLRenderTarget(1920, 1080, { samples: 4, type: T.HalfFloatType }));
composer.addPass(new X.RenderPass(scene, cam));
const bokeh = new X.BokehPass(scene, cam, { focus: 13, aperture: 0.0016, maxblur: 0.006 });
composer.addPass(bokeh);
composer.addPass(new X.OutputPass());

function label(id, t, a, b, wx, wy, wz) {
  const v = new T.Vector3(wx, wy, wz).project(cam);
  const e = $(id);
  e.style.left = ((v.x + 1) / 2 * 1920) + 'px'; e.style.top = ((1 - v.y) / 2 * 1080 + 40) + 'px';
  e.style.opacity = env(t, a, b, 0.9, 0.7).toFixed(3);
  e.style.transform = `translateY(${(1 - pr(t, a, a + 0.9, o3)) * 16}px)`;
}
function text(id, t, a, b) {
  const e = $(id);
  e.style.opacity = env(t, a, b, 1.0, 0.7).toFixed(3);
  e.style.transform = `translateY(${(1 - pr(t, a, a + 1.0, o3)) * 26}px)`;
}
function renderAt(t) {
  camAt(t);
  pages.forEach(p => pose(p, t));
  bokeh.uniforms.focus.value = cam.position.length() * 0.98;
  composer.render();
  STACKS.forEach((S, i) => label('l' + i, t, 6.0 + i * 0.35, 9.8, S.x, 0, H / 2 + 0.2));
  text('k1', t, 6.9, 9.8); text('h1', t, 7.1, 9.8);
  $('black').style.opacity = Math.max(1 - pr(t, 0, 0.8, o3), pr(t, 9.3, 10)).toFixed(3);
}
async function ready() { await document.fonts.ready; await Promise.all(pending); return true; }
window.FILM = { renderAt, ready, DUR, FPS };
ready().then(() => { renderAt(+(location.search.match(/t=([\d.]+)/) || [0, 8])[1]); window.FILM_READY = true; });
})();
</script>
</body>
</html>
